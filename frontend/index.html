<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库智能问答</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;}
html,body{height:100%;}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;background:#f7f9fb;}
header{background:#16406b;color:#fff;padding:13px 18px;font-size:16px;
  font-weight:600;display:flex;justify-content:space-between;align-items:center;}
header button{background:rgba(255,255,255,.18);color:#fff;
  border:1px solid rgba(255,255,255,.4);border-radius:6px;
  padding:5px 12px;font-size:13px;cursor:pointer;}
#chat{flex:1;overflow-y:auto;padding:18px;}
.row{display:flex;margin-bottom:14px;}
.row.me{justify-content:flex-end;}
.bubble{max-width:78%;padding:10px 14px;border-radius:12px;
  font-size:14.5px;line-height:1.7;word-break:break-word;}
.me .bubble{background:#16406b;color:#fff;border-bottom-right-radius:3px;}
.ai .bubble{background:#f1f4f8;color:#1b2430;border-bottom-left-radius:3px;}
.bubble p{margin:4px 0;}
.bubble pre{background:#1e2430;color:#e6edf3;padding:10px;border-radius:6px;
  overflow-x:auto;font-size:12.5px;}
.bubble :not(pre)>code{background:#e2e8f0;padding:1px 5px;border-radius:4px;}
footer{border-top:1px solid #e2e8f0;background:#fff;padding:12px 14px;
  display:flex;gap:8px;align-items:flex-end;}
#input{flex:1;border:1px solid #e2e8f0;border-radius:8px;padding:9px 12px;
  font-size:14.5px;font-family:inherit;resize:none;max-height:120px;outline:none;}
#input:focus{border-color:#1f5c8c;}
.iconbtn{border:none;border-radius:8px;height:40px;padding:0 16px;
  background:#16406b;color:#fff;font-size:15px;cursor:pointer;white-space:nowrap;}
.iconbtn:disabled{opacity:.5;}
.tip{font-size:12px;color:#8a94a6;text-align:center;padding:4px;}
@media (max-width:600px){ .bubble{max-width:90%;} #chat{padding:12px;} }
</style>
</head>
<body>
<header>
  <span>知识库智能问答</span>
  <button id="uploadBtn">上传文档</button>
  <input type="file" id="fileInput" hidden accept=".pdf,.txt,.md,.docx">
</header>
<div id="chat"></div>
<footer>
  <textarea id="input" rows="1"
    placeholder="输入问题，Enter 发送 / Shift+Enter 换行"></textarea>
  <button class="iconbtn" id="send">发送</button>
</footer>
<div class="tip">回答基于知识库资料，仅供参考</div>

<script>
const API = "http://127.0.0.1:8000";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const state = { history: [], busy: false };

function addRow(role, text){
  const row = document.createElement("div");
  row.className = "row " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
  return bubble;
}
function scrollBottom(){ chat.scrollTop = chat.scrollHeight; }

function welcome(){
  addRow("ai", "你好，我是知识库问答助手。<br>可以问我资料里的问题，"
    + "例如：<br>· 进程和线程的区别？<br>· 什么是 RAG？");
}

async function ask(question, aiBubble){
  const resp = await fetch(API + "/chat", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({question: question, history: state.history})
  });
  if(!resp.ok){
    aiBubble.textContent = "请求失败，请确认后端已启动（python app.py）";
    return "";
  }
  const reader = resp.body.getReader();
  const decoder = new TextDecoder("utf-8");
  let buffer = "", raw = "";
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buffer += decoder.decode(value, {stream:true});
    const events = buffer.split("\n\n");
    buffer = events.pop();
    for(const ev of events){
      const line = ev.split("\n").find(l => l.trim().startsWith("data:"));
      if(!line) continue;
      const data = line.replace(/^\s*data:/, "").trim();
      if(data === "[DONE]") continue;
      let piece = data;
      try{ piece = JSON.parse(data); }catch(e){}
      raw += piece;
      aiBubble.innerHTML = window.marked ? marked.parse(raw) : raw;
      scrollBottom();
    }
  }
  return raw;
}

async function send(){
  const question = input.value.trim();
  if(!question || state.busy) return;
  state.busy = true; sendBtn.disabled = true;
  addRow("me", question.replace(/</g, "&lt;"));
  input.value = ""; input.style.height = "auto";
  const aiBubble = addRow("ai", "正在思考…");
  const answer = await ask(question, aiBubble);
  if(answer){
    state.history.push({role:"user", content:question});
    state.history.push({role:"assistant", content:answer});
  }
  state.busy = false; sendBtn.disabled = false;
  input.focus();
}

sendBtn.onclick = send;
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

document.getElementById("uploadBtn").onclick =
  () => document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async e => {
  const file = e.target.files[0];
  if(!file) return;
  const fd = new FormData();
  fd.append("file", file);
  const aiBubble = addRow("ai", "正在上传《" + file.name + "》…");
  try{
    const r = await fetch(API + "/upload", {method:"POST", body:fd});
    const j = await r.json();
    aiBubble.innerHTML = "文档《" + j.filename + "》已保存。<br>"
      + "在后端完成入库后即可对其提问。";
  }catch(err){
    aiBubble.textContent = "上传失败，请确认后端已启动。";
  }
};

welcome(); input.focus();
</script>
</body>
</html>
